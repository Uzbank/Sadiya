<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Уроки Садии</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Pangolin&display=swap">
<style>
/* Layout: школьная тетрадь в клетку — одна колонка, поля слева красной линией, нижняя панель вкладок */
:root{
 --paper:#F7F9FC;--grid:#E3EAF4;--text:#1A2233;--muted:#5A6479;--ink:#2350B8;--margin:#E05A4F;
 --card:#FFFFFF;--line:#D6DEEA;--sun:#E9A800;--ok:#178A54;--okbg:#E3F5EA;--bad:#C8461C;--badbg:#FDEBE3;
 --math:#2459C9;--eng:#0B8A7A;--logic:#8A3FC0;--read:#C9571A;--test:#A87400;
 --display:'Pangolin','Comic Sans MS','Chalkboard SE',ui-rounded,system-ui,sans-serif;
 --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#14201B;--grid:#1C2B24;--text:#E7EFEA;--muted:#9DB0A6;--ink:#8DB4FF;--margin:#F08A7E;
 --card:#1B2A23;--line:#2C3F36;--sun:#F6C744;--ok:#4CD68A;--okbg:#173A2A;--bad:#FF9A6B;--badbg:#3D2219;
 --math:#86A9FF;--eng:#3FD1C0;--logic:#CE9BFF;--read:#FFA567;--test:#E8C24F;color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#14201B;--grid:#1C2B24;--text:#E7EFEA;--muted:#9DB0A6;--ink:#8DB4FF;--margin:#F08A7E;
 --card:#1B2A23;--line:#2C3F36;--sun:#F6C744;--ok:#4CD68A;--okbg:#173A2A;--bad:#FF9A6B;--badbg:#3D2219;
 --math:#86A9FF;--eng:#3FD1C0;--logic:#CE9BFF;--read:#FFA567;--test:#E8C24F;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--text);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.s-math{--c:var(--math)}.s-eng{--c:var(--eng)}.s-logic{--c:var(--logic)}.s-read{--c:var(--read)}.s-test{--c:var(--test)}

/* Шапка дня */
.hero{border-left:2px solid var(--margin);padding:4px 0 4px 14px;margin:4px 0 22px;display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font:400 34px/1.15 var(--display);color:var(--ink);margin:0;text-wrap:balance}
h2{font:400 24px/1.2 var(--display);color:var(--ink);margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.timebar{margin-top:10px;display:grid;gap:6px}
.timebar .track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.timebar .fill{height:100%;background:var(--sun);border-radius:6px}
.timebar small{color:var(--muted);font-variant-numeric:tabular-nums}

/* Уроки дня */
.list{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile:active{transform:scale(.99)}
.badge{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--card);font:400 24px/1 var(--display)}
.tname{display:block;font-weight:600;font-size:17px}
.ttopic{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.tmeta{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.go{display:inline-block;margin-top:4px;padding:4px 12px;border-radius:20px;background:var(--c);color:var(--card);font-weight:600;font-size:14px}
.stars{color:var(--sun);font-size:18px;letter-spacing:1px}
.tile.done{background:color-mix(in srgb,var(--card) 88%,var(--c))}
.note{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:18px;display:grid;gap:8px}
.note p{margin:0}
.section{margin-top:28px;display:grid;gap:10px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}

/* Урок */
.lbar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;margin-bottom:18px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;line-height:1}
.dots{display:flex;gap:4px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.half{background:var(--sun)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--c)}
.lnum{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;display:grid;gap:16px}
.qhead{display:flex;align-items:center;gap:10px;color:var(--c);font-weight:600;font-size:14px}
.qhead .badge{width:30px;height:30px;font-size:15px}
.qtext{font-size:19px;font-weight:500;margin:0;text-wrap:pretty}
.passage{background:color-mix(in srgb,var(--card) 92%,var(--c));border-radius:12px;padding:14px;font-size:17px;line-height:1.6}
.passage b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.big{font:400 38px/1.25 var(--display);text-align:center;color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;padding:6px 0}
.big.long{font-size:26px}
.big.pre{white-space:pre-line;font-size:24px;text-align:left;line-height:1.6;font-family:var(--body);font-weight:500}
.big.emo{font-size:44px;line-height:1.3}
.sayrow{display:flex;justify-content:center}
.say{border:1px solid var(--line);background:var(--paper);border-radius:24px;padding:8px 16px;font-size:16px}
.listen{display:grid;place-items:center}
.listen button{width:96px;height:96px;border-radius:50%;border:0;background:var(--c);color:var(--card);font-size:40px}
.answer{min-height:64px;border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;font:400 40px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.answer.empty{color:var(--line)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:58px;border-radius:14px;border:1px solid var(--line);background:var(--paper);font:400 28px/1 var(--display)}
.pad .ok{background:var(--ink);border-color:var(--ink);color:var(--card);font:600 17px/1 var(--body)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.col{grid-template-columns:1fr}
.opts button{min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--paper);padding:10px 12px;font-size:18px;font-weight:500;line-height:1.3}
.opts.emo button{font-size:38px}
.opts.sym button{font:400 34px/1 var(--display)}
.opts button.right{border-color:var(--ok);background:var(--okbg)}
.opts button.wrong{border-color:var(--bad);background:var(--badbg);opacity:.75}
.fb{border-radius:14px;padding:12px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.next{border:0;border-radius:12px;background:var(--ink);color:var(--card);padding:10px 20px;font-weight:600}
.rule{display:grid;gap:14px}
.rule p{margin:0;font-size:18px;line-height:1.6}
.cta{border:0;border-radius:16px;background:var(--c,var(--ink));color:var(--card);padding:16px;font-size:18px;font-weight:600;width:100%}
.ghost{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 16px;font-weight:500}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.result{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:20px}
.result .bigstars{font-size:56px;color:var(--sun);letter-spacing:6px}
.confirm{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* План */
.month{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mhead{width:100%;text-align:left;background:none;border:0;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.mname{font:400 20px/1.2 var(--display);color:var(--ink)}
.mtop{grid-column:1/-1;color:var(--muted);font-size:14px;line-height:1.4}
.mprog{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);align-self:center}
.cal{padding:0 12px 14px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.cal button{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;display:grid;place-items:center;padding:0;position:relative}
.cal button.full{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cal button.part{background:color-mix(in srgb,var(--paper) 70%,var(--sun));border-color:var(--sun)}
.cal button.miss{border-color:var(--bad);color:var(--bad)}
.cal button.today{outline:3px solid var(--ink);outline-offset:1px}
.cal button.sat{font-style:italic}

/* Успехи */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.kpi b{display:block;font:400 30px/1.1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.bars{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.bars .cols{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:110px;border-bottom:1px solid var(--line)}
.bars .cols i{display:block;background:var(--sun);border-radius:4px 4px 0 0;min-height:2px}
.bars .lab{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:10px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.subj{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.subj .badge{width:30px;height:30px;font-size:15px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--c)}
.subj small{color:var(--muted);font-variant-numeric:tabular-nums}

/* Родителям */
.form{display:grid;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.form label{display:grid;gap:6px;font-weight:500}
.form input,.form select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--text)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.info{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--margin);border-radius:4px 16px 16px 4px;padding:16px;display:grid;gap:8px}
.info p{margin:0}
.muted{color:var(--muted)}

/* Нижние вкладки */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs button{border:0;background:none;padding:6px 4px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);border-radius:12px}
.tabs button span{font:400 22px/1 var(--display)}
.tabs button.on{color:var(--ink);background:color-mix(in srgb,var(--card) 85%,var(--ink))}
.tabs.hide{display:none}
</style>

<div class="wrap"><main id="view" aria-live="polite"></main></div>
<nav class="tabs" id="tabs">
 <button data-tab="day" class="on"><span>☼</span>Сегодня</button>
 <button data-tab="plan"><span>▦</span>План</button>
 <button data-tab="stats"><span>★</span>Успехи</button>
 <button data-tab="parent"><span>⚙</span>Родителям</button>
</nav>

<script>
/* ===== Учебная программа: данные и генераторы заданий ===== */
const MONTHS=['Сентябрь','Октябрь','Ноябрь','Декабрь','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август'];
const MON_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}
function RNG(seed){let a=hashStr(seed);const f=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 return {f,int:(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)),pick:arr=>arr[Math.floor(f()*arr.length)],shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x},chance:p=>f()<p}}
function pl(n,f){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f[2];if(b>1&&b<5)return f[1];if(b===1)return f[0];return f[2]}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function num(q,big,a,o){return Object.assign({k:'num',q,big,a:String(a)},o||{})}
function mc(R,q,big,a,ds,o){const u=[String(a)];for(const d of ds){const s=String(d);if(!u.includes(s))u.push(s)}const opts=R.shuffle(u.slice(0,4));return Object.assign({k:'mc',q,big,opts,a:opts.indexOf(String(a))},o||{})}
function mcFixed(q,big,opts,ans,o){return Object.assign({k:'mc',q,big,opts,a:opts.indexOf(ans),fixed:1},o||{})}
function nd(R,a){const out=[];for(const c of R.shuffle([a+1,a-1,a+2,a-2,a+10,a-10,a+5]))if(c>=0&&c!==a&&!out.includes(c))out.push(c);return out.slice(0,3)}

const NM=[{n:'Садия',g:'Садии',f:1},{n:'Мадина',g:'Мадины',f:1},{n:'Азиз',g:'Азиза',f:0},{n:'Тимур',g:'Тимура',f:0},{n:'Лола',g:'Лолы',f:1},{n:'Самир',g:'Самира',f:0},{n:'Камила',g:'Камилы',f:1},{n:'Карим',g:'Карима',f:0}];
const IT=[['яблоко','яблока','яблок'],['конфета','конфеты','конфет'],['карандаш','карандаша','карандашей'],['мяч','мяча','мячей'],['книга','книги','книг'],['шарик','шарика','шариков'],['груша','груши','груш'],['машинка','машинки','машинок']];
const EMO=['🍎','⭐','🐟','🌸','🎈','🐞','🍓','🚗','🐥','🍬'];
const TH=['тысячу','тысячи','тысяч'];

/* ---------- Математика: генераторы ---------- */
const MG={
 count:(R,p)=>{const n=R.int(2,p.max||10),e=R.pick(EMO);return num('Посчитай. Сколько здесь всего?',Array(n).fill(e).join(' '),n,{emo:1})},
 cmp:(R,p)=>{const a=R.int(0,p.max);let b=R.chance(.2)?a:R.int(0,p.max);if(p.max>=1000&&R.chance(.5))b=Math.max(0,a+R.pick([-1,1])*R.int(1,p.max>=1e5?900:90));const s=a>b?'>':a<b?'<':'=';return mcFixed('Поставь знак: больше, меньше или равно',`${fmt(a)}  ?  ${fmt(b)}`,['>','<','='],s)},
 seq:(R,p)=>{const st=R.pick(p.steps||[1]);const len=5;const start=R.int(0,Math.max(0,p.max-st*(len-1)));let arr=Array.from({length:len},(_,i)=>start+i*st);if(p.max>10&&R.chance(.3))arr.reverse();const h=R.int(1,3);return num('Какое число пропущено?',arr.map((x,i)=>i===h?'__':fmt(x)).join(',  '),arr[h])},
 add:(R,p)=>{let a,b;for(let t=0;t<80;t++){a=R.int(p.min||1,p.max-1);b=R.int(1,p.max-a);const c=(a%10)+(b%10)>=10;if(!p.carry||p.carry==='any'||(p.carry==='yes')===c)break}return num('Реши пример',`${fmt(a)} + ${fmt(b)} = ?`,a+b)},
 sub:(R,p)=>{let a,b;for(let t=0;t<80;t++){a=R.int(p.min||2,p.max);b=R.int(1,a-1);const br=(a%10)<(b%10);if(!p.carry||p.carry==='any'||(p.carry==='yes')===br)break}return num('Реши пример',`${fmt(a)} − ${fmt(b)} = ?`,a-b)},
 comp:(R,p)=>{const n=R.int(3,p.n||10),a=R.int(1,n-1);return num('Состав числа',`${n} — это ${a} и ?`,n-a)},
 missAdd:(R,p)=>{const c=R.int(3,p.max),a=R.int(1,c-1),b=c-a;return R.chance(.5)?num('Какое число спряталось?',`${fmt(a)} + ? = ${fmt(c)}`,b):num('Какое число спряталось?',`? + ${fmt(b)} = ${fmt(c)}`,a)},
 missSub:(R,p)=>{const a=R.int(3,p.max),b=R.int(1,a-1);return num('Какое число спряталось?',`${fmt(a)} − ? = ${fmt(a-b)}`,b)},

function mathCfgs(g,mi,exam){if(exam)return {cur:MATH[4][8],list:[MATH[4][8],MATH[4][7],MATH[4][5],MATH[3][7]]};if(mi>8)return {cur:{t:'Летнее повторение',rule:'Летом повторяем всё, что прошли за год. По 20 минут в день — и в новом классе будет легко.'},list:MATH[g]};return {cur:MATH[g][mi],list:[MATH[g][mi]],prev:mi>0?MATH[g][mi-1]:(g>1?MATH[g-1][8]:null)}}
function pickGen(R,c){const src=(c.prev&&R.chance(.2))?c.prev:R.pick(c.list);return R.pick(src.g)}
function mathQ(R,c){const [k,p]=pickGen(R,c);return MG[k](R,p)}
function engQq(R,g,mi,exam){const gg=exam?4:g,mm=exam?8:mi;const P=engPool(gg,mm);let all=P.w.slice();if(all.length<8)all=all.concat(ENG[gg].flatMap(m=>m.w));if(all.length<8&&gg>1)all=all.concat(ENG[gg-1].flatMap(m=>m.w));let type=R.pick(EGEN[gg]);
 if(!exam&&mi<=8&&R.chance(.25)&&(mi>0||gg>1)){const pm=mi>0?mi-1:8,pg=mi>0?gg:gg-1;const PP=engPool(pg,pm);if(PP.w.length>=4||PP.s.length)return engQ(R,type,PP,all.concat(PP.w))}
 return engQ(R,type,P,all)}
function logicQ(R,g){return LG[R.pick(LGEN[g])](R,g)}
function readQ(R,g){return RG[R.pick(RGEN[g])](R,g)}
function engTopic(g,mi,exam){if(exam)return 'Exam practice';if(mi>8)return 'Summer review';return ENG[g][mi].t}
function lastSat(d){return d.getDay()===6&&d.getDate()+7>new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function buildLesson(iso,s,base){const [y,m,dd]=iso.split('-').map(Number);const d=new Date(y,m-1,dd);const c=ctxOf(d,base);const R=RNG(iso+'|'+s+'|'+base);const g=c.g,mi=c.mi;const mc_=mathCfgs(g,mi,c.exam);const qs=[];const seen=new Set();
 const add=(fn)=>{for(let t=0;t<12;t++){const q=fn();const key=q.q+'|'+q.big+'|'+(q.passage||'');if(!seen.has(key)){seen.add(key);qs.push(q);return}}qs.push(fn())};
 let title,topic,rule;
 if(s==='math'){const n=g<=2?10:12;for(let i=0;i<n;i++)add(()=>mathQ(R,mc_));title='Математика';topic=mc_.cur.t;rule=mc_.cur.rule}
 else if(s==='eng'){for(let i=0;i<8;i++)add(()=>engQq(R,g,mi,c.exam));title='English';topic=engTopic(g,mi,c.exam);rule=c.exam?ENG[4][8].rule:mi>8?'Летом повторяем английские слова и правила всего года.':ENG[g][mi].rule}
 else if(s==='logic'){const L=c.exam?4:g;for(let i=0;i<6;i++)add(()=>logicQ(R,L));title='Логика';topic=c.exam?'Логика: задания экзамена':'Логика и смекалка';rule=LRULE[L]}
 else if(s==='read'){for(let i=0;i<6;i++)add(()=>readQ(R,g));title='Русский язык';topic='Чтение и письмо';rule=RRULE[g]}
 else{const big=lastSat(d);const n=(g<=2?15:20)+(big?5:0);const L=c.exam?4:g;for(let i=0;i<n;i++){const r=i%10;add(()=>c.exam?(r<5?mathQ(R,mc_):r<8?logicQ(R,L):engQq(R,g,mi,true)):(r<5?mathQ(R,mc_):r<7?engQq(R,g,mi,false):r<9?logicQ(R,L):readQ(R,g)))}
  title=c.exam?'Пробный экзамен':big?'Контрольная за месяц':'Проверочная за неделю';topic=c.exam?'Математика, логика, английский':'Всё, что прошли';rule=c.exam?'Как на настоящем экзамене: сначала математика, потом логика и английский. Не торопись и проверяй себя.':'Проверим, что ты запомнила за '+(big?'месяц':'неделю')+'. Ошибки — это не страшно: мама или папа посмотрят их вместе с тобой.'}
 return {iso,s,title,topic,rule,mins:minutes(s,g),qs,grade:c.grade,g,mi,exam:c.exam}}
if(typeof module!=='undefined')module.exports={buildLesson,ctxOf,weekPlan,MATH,ENG,mathCfgs,engTopic,MONTHS};

</script>
<script>
const STORE='sadiya-app-v1';
let S=(()=>{const d={name:'Садия',base:1,limit:60,done:{},time:{},extra:{},started:null};try{const r=localStorage.getItem(STORE);if(r)return Object.assign(d,JSON.parse(r))}catch(e){}return d})();
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=document.getElementById('view');
let view={name:'day',date:today()},lesson=null,planG=null,openM=new Set(),confirmQuit=false,confirmReset=false;

/* Озвучка английских слов: в приложении Android — через мост AndroidTTS, в браузере — через speechSynthesis */
function canSpeak(){return !!(window.AndroidTTS||('speechSynthesis' in window))}
function speak(t){try{if(window.AndroidTTS&&window.AndroidTTS.speak){window.AndroidTTS.speak(t);return}if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^en[-_]GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}}catch(e){}}

function planFor(ds){const d=parseD(ds),c=ctxOf(d,S.base);return c.out?[]:weekPlan(c.g,c.exam,d.getDay())}
function rec(ds,s){return S.done[ds+'|'+s]}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n)}
function usedSec(){return S.time[today()]||0}
function limitSec(){return (S.limit+(S.extra[today()]||0))*60}
function topicOf(ds,s){const d=parseD(ds),c=ctxOf(d,S.base);if(s==='math')return mathCfgs(c.g,c.mi,c.exam).cur.t;if(s==='eng')return engTopic(c.g,c.mi,c.exam);if(s==='logic')return c.exam?'Логика: задания экзамена':'Логика и смекалка';if(s==='read')return 'Чтение и письмо';return c.exam?'Математика, логика, английский':lastSat(d)?'Всё, что прошли за месяц':'Задания по всем предметам недели'}
function nameOf(s,ds){if(s==='test'){const d=parseD(ds),c=ctxOf(d,S.base);return c.exam?'Пробный экзамен':lastSat(d)?'Контрольная':'Проверочная'}return SUBJ[s].n}

function tileHTML(ds,s){const d=parseD(ds),c=ctxOf(d,S.base),r=rec(ds,s);return `<button class="tile s-${s} ${r?'done':''}" data-start="${ds}|${s}">
 <span class="badge" aria-hidden="true">${SUBJ[s].ic}</span>
 <span><span class="tname">${esc(nameOf(s,ds))}</span><span class="ttopic">${esc(topicOf(ds,s))}</span></span>
 <span class="tmeta">${minutes(s,c.g)} мин<br>${r?`<span class="stars" aria-label="${r.st} из 3 звёзд">${starStr(r.st)}</span>`:'<span class="go">Начать</span>'}</span></button>`}

function missedDays(){const out=[];const t=new Date();for(let k=1;k<=21&&out.length<6;k++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-k);const ds=iso(d);if(S.started&&ds<S.started)break;const p=planFor(ds);if(!p.length)continue;const left=p.filter(s=>!rec(ds,s)).length;if(left)out.push([ds,left,d])}return out}

function dayHTML(ds){const d=parseD(ds),c=ctxOf(d,S.base),isT=ds===today();const p=c.out?[]:weekPlan(c.g,c.exam,d.getDay());const cfg=mathCfgs(c.g,c.mi,c.exam);
 let h=`<header class="hero"><span class="eyebrow">${d.getDate()} ${MON_GEN[d.getMonth()]} ${d.getFullYear()} · ${WD[d.getDay()]}${isT?' · Классная работа':''}</span>
 <h1>${isT?`Привет, ${esc(S.name)}!`:`${d.getDate()} ${MON_GEN[d.getMonth()]}`}</h1>
 <p class="sub">${c.out?'Программа начнётся 1 сентября '+(2026+(1-S.base)):`${c.exam?'Подготовка к экзамену':c.grade+' класс'} · ${MONTHS[c.mi]} · ${esc(cfg.cur.t)}`}</p>`;
 if(isT){const u=Math.round(usedSec()/60),L=S.limit+(S.extra[today()]||0);h+=`<div class="timebar"><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${L}" aria-valuenow="${u}"><div class="fill" style="width:${Math.min(100,u/L*100)}%"></div></div><small>Сегодня занималась ${u} из ${L} минут</small></div>`}
 h+=`</header>`;
 if(!isT)h+=`<div class="row" style="margin:-10px 0 16px"><button class="ghost" data-act="today">← К сегодняшнему дню</button></div>`;
 if(p.length){h+=`<div class="list">${p.map(s=>tileHTML(ds,s)).join('')}</div>`;const all=p.every(s=>rec(ds,s));if(all)h+=`<div class="note" style="margin-top:14px"><p><b>Все уроки этого дня выполнены!</b> ${isT?'Отдыхай и играй — завтра продолжим.':''}</p></div>`}
 else if(!c.out)h+=`<div class="note"><h2>Воскресенье — выходной</h2><p>Сегодня уроков нет. Погуляй, почитай любимую книжку, порисуй. В понедельник продолжим!</p></div>`;
 else h+=`<div class="note"><p>На эту дату уроков нет. Откройте вкладку «План», чтобы выбрать день.</p></div>`;
 if(isT){const m=missedDays();if(m.length)h+=`<section class="section"><span class="label">Можно догнать</span><div class="chips">${m.map(([x,n,dd])=>`<button class="chip" data-day="${x}">${dd.getDate()} ${MON_GEN[dd.getMonth()]} · ${n} ${pl(n,['урок','урока','уроков'])}</button>`).join('')}</div></section>`}
 return h}

/* ---------- Урок ---------- */
function startLesson(ds,s){if(usedSec()>=limitSec()){view={name:'limit'};render();return}const L=buildLesson(ds,s,S.base);lesson={L,i:-1,score:0,tries:0,input:'',t0:Date.now(),res:[],locked:false};confirmQuit=false;view={name:'lesson'};render()}
function qHTML(){const {L,i}=lesson,q=L.qs[i];const s=L.s;
 const dots=L.qs.map((_,j)=>`<i class="${j<i?(lesson.res[j]===1?'ok':lesson.res[j]===.5?'half':'no'):j===i?'now':''}"></i>`).join('');
 let h=`<div class="s-${s}"><header class="lbar"><button class="x" data-act="quit" aria-label="Выйти из урока">×</button><div class="dots" aria-hidden="true">${dots}</div><span class="lnum">${i+1}/${L.qs.length}</span></header>`;
 if(confirmQuit)h+=`<div class="confirm"><p style="margin:0">Выйти из урока? Ответы этого урока не сохранятся.</p><div class="row"><button class="next" data-act="quit-yes">Выйти</button><button class="ghost" data-act="quit-no">Продолжить урок</button></div></div>`;
 h+=`<article class="qcard"><div class="qhead"><span class="badge" aria-hidden="true">${SUBJ[s].ic}</span>${esc(L.title)}</div>`;
 if(q.passage)h+=`<div class="passage"><b>${esc(q.ptitle||'Прочитай текст')}</b>${esc(q.passage)}</div>`;
 h+=`<p class="qtext">${esc(q.q)}</p>`;
 if(q.listen){h+=canSpeak()?`<div class="listen"><button data-say="${esc(q.listen)}" aria-label="Послушать слово">🔊</button></div>`:`<div class="big">${esc(q.listen)}</div>`}
 else if(q.big){const long=String(q.big).length>26&&!q.pre&&!q.emo;h+=`<div class="big ${q.pre?'pre':''} ${q.emo?'emo':''} ${long?'long':''}">${esc(q.big)}</div>`}
 if(q.say&&canSpeak())h+=`<div class="sayrow"><button class="say" data-say="${esc(q.say)}">🔊 Послушать</button></div>`;
 if(q.k==='num'){h+=`<div class="answer ${lesson.input?'':'empty'}" id="ans" aria-live="polite">${lesson.input||'?'}</div>`;
  if(!lesson.locked)h+=`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-key="${n}">${n}</button>`).join('')}<button data-key="back" aria-label="Стереть">⌫</button><button data-key="0">0</button><button class="ok" data-key="ok">Проверить</button></div>`}
 else{const emo=q.emoOpts||q.emo&&q.opts.every(o=>/^\p{Extended_Pictographic}/u.test(o));const sym=q.opts.every(o=>o.length<=2&&!/\p{L}/u.test(o));const col=q.col||q.opts.some(o=>o.length>16);
  h+=`<div class="opts ${emo?'emo':''} ${sym&&!emo?'sym':''} ${col?'col':''}">${q.opts.map((o,j)=>`<button data-opt="${j}" class="${lesson.mark&&lesson.mark[j]||''}" ${lesson.locked||lesson.mark&&lesson.mark[j]==='wrong'?'disabled':''}>${esc(o)}</button>`).join('')}</div>`}
 if(lesson.fb)h+=`<div class="fb ${lesson.fb.ok?'ok':'bad'}" role="status"><span>${esc(lesson.fb.t)}</span>${lesson.locked?`<button class="next" data-act="next">${i+1<L.qs.length?'Дальше →':'Готово'}</button>`:''}</div>`;
 return h+`</article></div>`}
function ruleHTML(){const L=lesson.L;return `<div class="s-${L.s}"><header class="lbar"><button class="x" data-act="quit-yes" aria-label="Назад">×</button><div></div><span class="lnum">${L.mins} мин</span></header>
 <article class="qcard rule"><div class="qhead"><span class="badge" aria-hidden="true">${SUBJ[L.s].ic}</span>${esc(L.title)}</div><h2>${esc(L.topic)}</h2><p>${esc(L.rule)}</p><p class="muted" style="font-size:15px">${L.qs.length} ${pl(L.qs.length,['задание','задания','заданий'])} · примерно ${L.mins} минут</p><button class="cta" data-act="begin">Начать урок</button></article></div>`}
function check(val){const q=lesson.L.qs[lesson.i];const ok=q.k==='num'?String(val)===q.a:val===q.a;
 if(ok){const pts=lesson.tries?0.5:1;lesson.score+=pts;lesson.res[lesson.i]=pts;lesson.locked=true;lesson.fb={ok:1,t:lesson.tries?'Верно, со второй попытки!':R_PRAISE()};if(q.k==='mc'){lesson.mark=lesson.mark||{};lesson.mark[val]='right'}if(q.after&&canSpeak())speak(q.after)}
 else if(!lesson.tries){lesson.tries=1;lesson.fb={ok:0,t:'Не совсем. Подумай и попробуй ещё раз!'};if(q.k==='mc'){lesson.mark=lesson.mark||{};lesson.mark[val]='wrong'}lesson.input='';render();const c=V.querySelector('.qcard');if(c)c.classList.add('shake');return}
 else{lesson.res[lesson.i]=0;lesson.locked=true;const right=q.k==='num'?q.a:q.opts[q.a];lesson.fb={ok:0,t:'Правильный ответ: '+right};if(q.k==='mc'){lesson.mark=lesson.mark||{};lesson.mark[val]='wrong';lesson.mark[q.a]='right'}else lesson.input=q.a}
 render()}
const PRAISE=['Верно! Молодец!','Правильно!','Отлично!','Умница!','Так держать!','Супер!'];let pi=0;function R_PRAISE(){pi=(pi+1)%PRAISE.length;return PRAISE[pi]}
function nextQ(){lesson.i++;lesson.tries=0;lesson.input='';lesson.fb=null;lesson.locked=false;lesson.mark=null;if(lesson.i>=lesson.L.qs.length){finish();return}render();window.scrollTo(0,0)}
function addTime(sec){const t=today();S.time[t]=(S.time[t]||0)+sec}
function finish(){const L=lesson.L,sec=Math.min(3600,Math.round((Date.now()-lesson.t0)/1000)),pct=lesson.score/L.qs.length;const st=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;const k=L.iso+'|'+L.s;const prev=S.done[k];
 const r={sc:Math.round(pct*100),st,sec,at:Date.now(),n:L.qs.length,right:lesson.score};if(!prev||prev.sc<=r.sc)S.done[k]=r;addTime(sec);save();view={name:'result',r,L};lesson=null;render()}
function resultHTML(){const {r,L}=view;const msg=r.st===3?'Блестяще! Ты всё знаешь.':r.st===2?'Хорошая работа! Ещё чуть-чуть — и будет идеально.':r.st===1?'Неплохо! Давай повторим правило ещё раз.':'Ничего страшного. Разберём ошибки вместе с мамой или папой и попробуем снова.';
 return `<div class="result s-${L.s}"><span class="eyebrow">${esc(L.title)} · ${esc(L.topic)}</span><div class="bigstars" aria-label="${r.st} из 3 звёзд">${starStr(r.st)}</div><h1>${r.st>=2?'Молодец, '+esc(S.name)+'!':'Урок закончен'}</h1><p class="sub">Правильно ${String(r.right).replace('.',',')} из ${r.n} · ${Math.max(1,Math.round(r.sec/60))} мин</p><p>${msg}</p><div class="row" style="justify-content:center"><button class="cta" style="width:auto;padding:14px 28px" data-act="back">К урокам</button>${r.st<3?`<button class="ghost" data-start="${L.iso}|${L.s}">Пройти ещё раз</button>`:''}</div></div>`}
function limitHTML(){return `<div class="result"><div class="bigstars">☾</div><h1>На сегодня хватит!</h1><p class="sub">Ты занималась ${Math.round(usedSec()/60)} минут. Глазкам и голове нужен отдых.</p><p>Завтра будут новые интересные задания.</p><div class="row" style="justify-content:center"><button class="cta" style="width:auto;padding:14px 28px" data-act="back">Хорошо</button><button class="ghost" data-act="extra">Ота-она: яна 15 дақиқа</button></div></div>`}

/* ---------- План ---------- */
function monthStats(y,m){let tot=0,dn=0;const n=new Date(y,m+1,0).getDate();for(let k=1;k<=n;k++){const ds=iso(new Date(y,m,k));const p=planFor(ds);tot+=p.length;dn+=p.filter(s=>rec(ds,s)).length}return [dn,tot]}
function planHTML(){const cur=ctxOf(new Date(),S.base);const g=planG||Math.min(4,Math.max(1,cur.grade));const sy=2026+g-S.base;const t=today();
 let h=`<header class="hero"><span class="eyebrow">Программа на ${sy}–${sy+1} учебный год</span><h1>${g} класс</h1><p class="sub">Каждый месяц — новая тема. Нажми на месяц, чтобы открыть дни.</p></header>
 <div class="chips" role="tablist" style="margin-bottom:16px">${[1,2,3,4].map(x=>`<button class="chip ${x===g?'on':''}" data-grade="${x}" role="tab" aria-selected="${x===g}">${x} класс</button>`).join('')}</div><div class="list">`;
 for(let mi=0;mi<12;mi++){const y=sy+(mi>=4?1:0),m=(mi+8)%12;const d1=new Date(y,m,1);const c=ctxOf(d1,S.base);const cfg=mathCfgs(c.g,c.mi,c.exam);const [dn,tot]=monthStats(y,m);const key=y+'-'+m;const open=openM.has(key);
  h+=`<div class="month"><button class="mhead" data-month="${key}" aria-expanded="${open}"><span class="mname">${MONTHS[mi]} ${y}</span><span class="mprog">${dn}/${tot} ${open?'▴':'▾'}</span><span class="mtop">Математика: ${esc(cfg.cur.t)}<br>English: ${esc(engTopic(c.g,c.mi,c.exam))}</span></button>`;
  if(open){h+=`<div class="cal">${['Пн','Вт','Ср','Чт','Пт','Сб'].map(w=>`<span class="wd">${w}</span>`).join('')}`;const n=new Date(y,m+1,0).getDate();let first=true;
   for(let k=1;k<=n;k++){const d=new Date(y,m,k),w=d.getDay();if(w===0)continue;if(first){for(let b=1;b<w;b++)h+='<span></span>';first=false}const ds=iso(d);const p=planFor(ds);const dd=p.filter(s=>rec(ds,s)).length;const cls=[p.length&&dd===p.length?'full':dd?'part':ds<t&&p.length&&(!S.started||ds>=S.started)?'miss':'',ds===t?'today':'',w===6?'sat':''].join(' ');
    h+=`<button class="${cls}" data-day="${ds}" aria-label="${k} ${MON_GEN[m]}: выполнено ${dd} из ${p.length}">${k}</button>`}
   h+=`</div>`}
  h+=`</div>`}
 return h+`</div>`}

/* ---------- Успехи ---------- */
function statsHTML(){const recs=Object.entries(S.done);const stars=recs.reduce((a,[,r])=>a+r.st,0);const mins=Math.round(Object.values(S.time).reduce((a,b)=>a+b,0)/60);
 let streak=0;for(let k=0;k<400;k++){const d=new Date();d.setDate(d.getDate()-k);const ds=iso(d);const has=recs.some(([kk])=>kk.startsWith(ds));if(has)streak++;else if(k===0||d.getDay()===0)continue;else break}
 let h=`<header class="hero"><span class="eyebrow">Дневник успехов</span><h1>${esc(S.name)}</h1><p class="sub">Звёзды за уроки, минуты занятий и любимые предметы.</p></header>
 <div class="kpis"><div class="kpi"><b>${stars}</b><span>звёзд</span></div><div class="kpi"><b>${recs.length}</b><span>${pl(recs.length,['урок','урока','уроков'])}</span></div><div class="kpi"><b>${streak}</b><span>${pl(streak,['день','дня','дней'])} подряд</span></div></div>`;
 const days=[];for(let k=13;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);days.push(d)}const mx=Math.max(60,...days.map(d=>(S.time[iso(d)]||0)/60));
 h+=`<section class="section"><span class="label">Минуты за 14 дней · всего ${mins} мин</span><div class="bars"><div class="cols">${days.map(d=>{const v=(S.time[iso(d)]||0)/60;return `<i style="height:${v/mx*100}%" title="${Math.round(v)} мин"></i>`}).join('')}</div><div class="lab">${days.map(d=>`<span>${d.getDate()}</span>`).join('')}</div></div></section>`;
 h+=`<section class="section"><span class="label">По предметам</span>`;for(const s of ['math','eng','logic','read','test']){const rs=recs.filter(([k])=>k.endsWith('|'+s)).map(([,r])=>r);const avg=rs.length?Math.round(rs.reduce((a,r)=>a+r.sc,0)/rs.length):0;
  h+=`<div class="subj s-${s}"><span class="badge" aria-hidden="true">${SUBJ[s].ic}</span><div><b>${SUBJ[s].n}</b><div class="meter"><i style="width:${avg}%"></i></div></div><small>${rs.length?avg+'% · '+rs.length+' ур.':'пока нет'}</small></div>`}
 h+=`</section>`;const last=recs.sort((a,b)=>b[1].at-a[1].at).slice(0,6);
 if(last.length)h+=`<section class="section"><span class="label">Последние уроки</span><div class="tbl"><table><thead><tr><th>Дата</th><th>Урок</th><th>Итог</th></tr></thead><tbody>${last.map(([k,r])=>{const [ds,s]=k.split('|');const d=parseD(ds);return `<tr><td>${d.getDate()} ${MON_GEN[d.getMonth()]}</td><td>${SUBJ[s].n}</td><td><span class="stars">${starStr(r.st)}</span> ${r.sc}%</td></tr>`}).join('')}</tbody></table></div></section>`;
 else h+=`<div class="note" style="margin-top:20px"><p>Здесь появятся звёзды после первого урока.</p></div>`;
 return h}

/* ---------- Родителям (на узбекском) ---------- */
function parentHTML(){const c=ctxOf(new Date(),S.base);const g=Math.min(4,Math.max(1,c.grade));
 let h=`<header class="hero"><span class="eyebrow">Ота-оналар учун</span><h1>Созламалар</h1><p class="sub">Дастур 1–4-синф ва Президент мактабига кириш имтиҳонигача кунма-кун тузилган.</p></header>
 <div class="form"><label for="f-name">Боланинг исми<input id="f-name" value="${esc(S.name)}" maxlength="20"></label>
 <label for="f-base">2026–2027 ўқув йилида нечанчи синфда?<select id="f-base">${[1,2,3,4].map(x=>`<option value="${x}" ${x===S.base?'selected':''}>${x}-синф</option>`).join('')}</select></label>
 <label for="f-lim">Кунлик вақт чеклови<select id="f-lim">${[30,45,60].map(x=>`<option value="${x}" ${x===S.limit?'selected':''}>${x} дақиқа</option>`).join('')}</select></label>
 <div class="row"><button class="next" data-act="save">Сақлаш</button><button class="ghost" data-act="extra">Бугун яна 15 дақиқа</button></div><span class="muted" id="saved" style="font-size:14px"></span></div>
 <section class="section"><span class="label">Президент мактаби имтиҳони</span><div class="info"><p>Президент мактабларига <b>5-синфга</b> қабул қилинади. <b>1-босқич</b> — математика. <b>2-босқич</b> — мантиқий фикрлаш ва инглиз тили.</p><p>Шунинг учун дастурда математика ҳар куни бор, мантиқ ва инглиз тили ҳафтасига 4–5 марта. Рус тили мактабдаги ўқиш учун.</p><p class="muted" style="font-size:14px">Қабул шартлари ҳар йили янгиланиши мумкин — ихтисослаштирилган таълим агентлигининг 1206 call-марказидан аниқлаштиринг.</p></div></section>
 <section class="section"><span class="label">Ҳафталик жадвал (${g}-синф)</span><div class="tbl"><table><thead><tr><th>Кун</th><th>Дарслар</th><th>Вақт</th></tr></thead><tbody>${[1,2,3,4,5,6,0].map(w=>{const p=weekPlan(g,c.exam,w);const uzd=['Якшанба','Душанба','Сешанба','Чоршанба','Пайшанба','Жума','Шанба'][w];return `<tr><td>${uzd}</td><td>${p.length?p.map(s=>SUBJ[s].n).join(', '):'Дам олиш'}</td><td>${p.reduce((a,s)=>a+minutes(s,g),0)||'—'}${p.length?' дақ.':''}</td></tr>`}).join('')}</tbody></table></div><p class="muted" style="margin:0;font-size:14px">Шанба — ҳафталик текширув, ойнинг охирги шанбаси — ойлик назорат иши.</p></section>
 <section class="section"><span class="label">${g}-синф дастури ойма-ой</span><div class="tbl"><table><thead><tr><th>Ой</th><th>Математика</th><th>Инглиз тили</th></tr></thead><tbody>${MATH[g].map((m,i)=>`<tr><td>${MONTHS[i]}</td><td>${esc(m.t)}</td><td>${esc(ENG[g][i].t)}</td></tr>`).join('')}<tr><td>Июнь–Август</td><td>Ёзги такрорлаш${g===4?' ва пробный имтиҳонлар':''}</td><td>${g===4?'Exam practice':'Summer review'}</td></tr></tbody></table></div></section>
 <section class="section"><span class="label">Маълумотлар</span>${confirmReset?`<div class="confirm"><p style="margin:0">Барча юлдузлар ва натижалар ўчирилсинми? Буни қайтариб бўлмайди.</p><div class="row"><button class="next" style="background:var(--bad)" data-act="reset-yes">Ҳа, ўчириш</button><button class="ghost" data-act="reset-no">Бекор қилиш</button></div></div>`:`<div class="row"><button class="ghost" data-act="reset">Натижаларни тозалаш</button></div>`}<p class="muted" style="margin:0;font-size:14px">Натижалар фақат шу телефонда сақланади.</p></section>`;
 return h}

/* ---------- Отрисовка и события ---------- */
function render(){const tabs=document.getElementById('tabs');const inL=view.name==='lesson';tabs.classList.toggle('hide',inL);
 const tn=view.name==='day'?'day':view.name==='plan'?'plan':view.name==='stats'?'stats':view.name==='parent'?'parent':'';tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tn));
 if(view.name==='day')V.innerHTML=dayHTML(view.date);else if(view.name==='lesson')V.innerHTML=lesson.i<0?ruleHTML():qHTML();else if(view.name==='result')V.innerHTML=resultHTML();else if(view.name==='limit')V.innerHTML=limitHTML();else if(view.name==='plan')V.innerHTML=planHTML();else if(view.name==='stats')V.innerHTML=statsHTML();else V.innerHTML=parentHTML()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
 if(D.tab){view=D.tab==='day'?{name:'day',date:today()}:{name:D.tab};confirmReset=false;render();window.scrollTo(0,0);return}
 if(D.start){const [ds,s]=D.start.split('|');startLesson(ds,s);window.scrollTo(0,0);return}
 if(D.day){view={name:'day',date:D.day};render();window.scrollTo(0,0);return}
 if(D.grade){planG=+D.grade;render();return}
 if(D.month){openM.has(D.month)?openM.delete(D.month):openM.add(D.month);render();return}
 if(D.say){speak(D.say);return}
 if(D.key&&lesson&&!lesson.locked){if(D.key==='back')lesson.input=lesson.input.slice(0,-1);else if(D.key==='ok'){if(lesson.input)check(lesson.input);return}else if(lesson.input.length<7)lesson.input=(lesson.input==='0'?'':lesson.input)+D.key;const a=document.getElementById('ans');if(a){a.textContent=lesson.input||'?';a.classList.toggle('empty',!lesson.input)}return}
 if(D.opt&&lesson&&!lesson.locked){check(+D.opt);return}
 const A=D.act;if(!A)return;
 if(A==='begin'){lesson.i=0;lesson.t0=Date.now();render()}
 else if(A==='next')nextQ();
 else if(A==='quit'){confirmQuit=true;render()}
 else if(A==='quit-no'){confirmQuit=false;render()}
 else if(A==='quit-yes'){if(lesson&&lesson.i>=0)addTime(Math.min(3600,Math.round((Date.now()-lesson.t0)/1000)));save();const ds=lesson?lesson.L.iso:today();lesson=null;confirmQuit=false;view={name:'day',date:ds};render()}
 else if(A==='back'){view={name:'day',date:view.L?view.L.iso:today()};render()}
 else if(A==='today'){view={name:'day',date:today()};render()}
 else if(A==='extra'){const t=today();S.extra[t]=(S.extra[t]||0)+15;save();if(view.name==='limit')view={name:'day',date:t};render();const sv=document.getElementById('saved');if(sv)sv.textContent='Бугунги чеклов 15 дақиқага узайтирилди.'}
 else if(A==='save'){const n=document.getElementById('f-name').value.trim();S.name=n||'Садия';S.base=+document.getElementById('f-base').value;S.limit=+document.getElementById('f-lim').value;save();render();const sv=document.getElementById('saved');if(sv)sv.textContent='Сақланди.'}
 else if(A==='reset'){confirmReset=true;render()}
 else if(A==='reset-no'){confirmReset=false;render()}
 else if(A==='reset-yes'){S.done={};S.time={};S.extra={};confirmReset=false;save();render()}
});
document.addEventListener('keydown',e=>{if(!lesson||lesson.i<0||view.name!=='lesson')return;const q=lesson.L.qs[lesson.i];if(lesson.locked){if(e.key==='Enter')nextQ();return}if(q.k==='num'){if(/^\d$/.test(e.key)&&lesson.input.length<7){lesson.input=(lesson.input==='0'?'':lesson.input)+e.key}else if(e.key==='Backspace')lesson.input=lesson.input.slice(0,-1);else if(e.key==='Enter'&&lesson.input){check(lesson.input);return}else return;const a=document.getElementById('ans');if(a){a.textContent=lesson.input||'?';a.classList.toggle('empty',!lesson.input)}}});
if('speechSynthesis' in window){try{speechSynthesis.getVoices()}catch(e){}}
if(!S.started){S.started=today();save()}
render();
</script>
