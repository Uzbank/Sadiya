name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        run: git clone --depth 1 https://github.com/${{ github.repository }} .
      - name: Get Gradle 8.7
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d $HOME
      - name: Build APK
        run: |
          export JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}
          $HOME/gradle-8.7/bin/gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Sadiya-darslar.apk
          gh release create "v${{ github.run_number }}" Sadiya-darslar.apk --title "Uroki Sadii v${{ github.run_number }}" --notes "APK"
